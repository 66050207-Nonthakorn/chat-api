services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports: ["127.0.0.1:25433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 2s
      timeout: 2s
      retries: 30
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["127.0.0.1:26380:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  media:
    image: chrislusf/seaweedfs:4.52
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: secret
      S3_BUCKET: cloudchat-images
    ports: ["127.0.0.1:28334:8333"]
